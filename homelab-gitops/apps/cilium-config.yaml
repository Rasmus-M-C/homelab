# Cilium LoadBalancer IP pool and L2 announcement policy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Rasmus-M-C/homelab.git
    targetRevision: main
    path: homelab-gitops/manifests/cilium-config
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
