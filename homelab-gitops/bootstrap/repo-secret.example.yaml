# ONLY needed if the GitHub repo is private. Do NOT commit the filled-in copy.
# 1. GitHub -> Settings -> Developer settings -> Fine-grained tokens:
#    access to this repo only, permission "Contents: Read-only".
# 2. Copy to repo-secret.yaml (git-ignored), fill in, then:
#    kubectl apply -f bootstrap/repo-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: homelab-gitops-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/Rasmus-M-C/homelab.git
  username: Rasmus-M-C
  password: github_pat_xxx
