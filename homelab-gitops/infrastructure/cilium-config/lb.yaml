# IPs Cilium may give to LoadBalancer services.
# Pick a range OUTSIDE your router's DHCP range and not used by anything.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: default
spec:
  blocks:
    - start: 192.168.50.200
      stop: 192.168.50.220
---
# Answer ARP requests for those IPs on the nodes' network interface.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
spec:
  loadBalancerIPs: true
  interfaces:
    - ^eth[0-9]+
