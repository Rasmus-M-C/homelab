apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - helmrepository.yaml
  - helmrelease.yaml
# Turn values.yaml into a ConfigMap the HelmRelease reads. bootstrap.ps1 uses
# the same file, so the first install and Flux always agree.
configMapGenerator:
  - name: cilium-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
